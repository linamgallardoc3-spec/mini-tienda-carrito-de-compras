<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" >Minimarket</a>
            <p class="">Total de items en el carrito <span id="badge" class="badge text-bg-success">0</span></p>
        </div>
    </nav>
    <div class="container text-center">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col">
                <div class="card">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Fresas</h5>
                        <p class="card-text">Precio: $15000</p>
                        <button class="btn-agregar btn btn-success" data-nombre="Fresas" data-precio="15000">Agregar</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Sandia</h5>
                        <p class="card-text">Precio: $10000</p>
                        <button class="btn-agregar btn btn-success" data-nombre="Sandia" data-precio="10000">Agregar</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Platano</h5>
                        <p class="card-text">Precio: $3000</p>
                        <button class="btn-agregar btn btn-success" data-nombre="Platano" data-precio="3000">Agregar</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Aguacate</h5>
                        <p class="card-text">Precio: $4000</p>
                        <button class="btn-agregar btn btn-success" data-nombre ="Aguacate" data-precio="4000">Agregar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <section class="container mt-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="bi bi-cart3 me-2"></i>Tu Carrito</h4>
                    </div>                    
                    <div class="card-body">
                        <ul id="lista-carrito" class="list-group list-group-flush mb-3">
                            <!-- <li class="list-group-item text-center text-muted py-3">El carrito está vacío</li> -->
                        </ul>                        
                        <div class="d-flex justify-content-between align-items-center border-top pt-3">
                            <h5>Total: <span class="text-success">$<span id="total">0.00</span></span></h5>
                            <button id="btn-vaciar" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash3 me-1"></i>Vaciar Carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
